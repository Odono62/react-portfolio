[build]
  # Install dependencies if they are missing (e.g. builds that skip the install step)
  command = "([ -x node_modules/.bin/vite ] || npm ci) && npm run build"
  publish = "dist"

# Serve index.html for client-side routes handled by React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
